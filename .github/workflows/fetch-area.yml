name: Скачать район для диорамы
on:
  workflow_dispatch:
  push:
    paths: [".github/area-request.txt", "tools/fetch_area.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -v '^#' .github/area-request.txt | while read n s w no e; do [ -n "$n" ] && python tools/fetch_area.py $n $s $w $no $e; sleep 3; done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet || git commit -m "OSM: район для диорамы"
          git pull --rebase -q && git push
