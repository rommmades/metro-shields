name: Скачать канал «Подземник»
on:
  workflow_dispatch:
  push:
    paths: ["tools/fetch_tg.py", ".github/tg-request.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fetch_tg.py podzemnik_spb
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/tg
          git diff --cached --quiet || git commit -m "Канал «Подземник»: лента постов"
          git pull --rebase -q && git push
