name: Геокодировать адреса
on:
  workflow_dispatch:
  push:
    paths: [".github/geocode-request.txt", "tools/geocode.py"]
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/geocode.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet || git commit -m "OSM: геокодированы адреса"
          git pull --rebase -q && git push
