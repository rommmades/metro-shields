name: Скачать трассы из OpenStreetMap
on:
  workflow_dispatch:
    inputs:
      name: { description: "Имя файла", required: true, default: "nvl-north" }
      bbox: { description: "юг запад север восток", required: true, default: "59.975 30.15 60.06 30.33" }
  push:
    paths: [".github/osm-request.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать
        run: |
          if [ -n "${{ github.event.inputs.name }}" ]; then
            python tools/fetch_osm.py ${{ github.event.inputs.name }} ${{ github.event.inputs.bbox }}
          else
            while read -r n s w no e; do [ -n "$n" ] && python tools/fetch_osm.py "$n" "$s" "$w" "$no" "$e"; done < .github/osm-request.txt
          fi
      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet || git commit -m "OSM: обновлены трассы"
          git push
